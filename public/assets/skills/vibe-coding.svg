<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="vibe-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3D5A" />
      <stop offset="50%" stop-color="#BD53ED" />
      <stop offset="100%" stop-color="#4CC9FF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="glow" />
      <feComposite in="SourceGraphic" in2="glow" operator="over" />
    </filter>
  </defs>

  <!-- Left Bracket < -->
  <path d="M18 20 L8 32 L18 44" fill="none" stroke="url(#vibe-grad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />

